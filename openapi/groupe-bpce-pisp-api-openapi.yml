  /payment-requests/{paymentRequestResourceId}/confirmation:
    post:
      operationId: paymentRequestConfirmationPost
      summary: Confirmation of a payment request using an OAUTH2 Authorization code grant…
      description: '### Description

        The PISP confirms one of the following requests or modifications:

        - payment request on behalf of a merchant

        - transfer request on behalf of the account''s owner

        - standing-order request on behalf of the account''s owner

        The ASPSP answers with a status of the relevant request and the subsequent Credit Transfer.


        ### Prerequisites

        - The TPP was registered by the Registration Authority for the PISP role

        - The TPP was provided with an OAUTH2 "Client Credential" access token by the ASPSP (cf. § 3.4.2).

        - The TPP has previously posted a Request which was saved by the ASPSP (cf. § 4.5.3)

        - The ASPSP has answered with a location link to the saved Payment Request (cf. § 4.5.4)

        - The TPP has retrieved the saved request in order to get the relevant resource Ids (cf. § 4.6).

        - The PSU was authenticated by the ASPSP through an OAUTH2 authorization code grant flow (REDIRECT approach) and the PISP got the relevant token

        - The TPP and the ASPSP have successfully processed a mutual check and authentication

        - The TPP has presented its "OAUTH2 Authorization Code" access token


        ### Business flow

        Once the PSU was authenticated through an OAUTH2 authorization code grant flow (REDIRECT approach), it is the due to the PISP to confirm the Request to the ASPSP in order to complete the process flow.

        The ASPSP must wait for confirmation before executing the subsequent Credit Tranfer.

        Any further confirmation by the PISP on the same Payment-Request must be ignored.'
      parameters:
      - $ref: '#/components/parameters/AuthorizationParameter'
      - $ref: '#/components/parameters/PaymentRequestResourceIdentification'
      - $ref: '#/components/parameters/PsuIpAddressHeader'
      - $ref: '#/components/parameters/PsuIpPortHeader'
      - $ref: '#/components/parameters/PsuHttpMethodHeader'
      - $ref: '#/components/parameters/PsuDateHeader'
      - $ref: '#/components/parameters/PsuGeoLocation'
      - $ref: '#/components/parameters/PsuUserAgentHeader'
      - $ref: '#/components/parameters/PsuRefererHeader'
      - $ref: '#/components/parameters/PsuAcceptHeader'
      - $ref: '#/components/parameters/PsuAcceptCharsetHeader'
      - $ref: '#/components/parameters/PsuAcceptEncodingHeader'
      - $ref: '#/components/parameters/PsuAcceptLanguageHeader'
      - $ref: '#/components/parameters/PsuDeviceId'
      - $ref: '#/components/parameters/DigestHeader'
      - $ref: '#/components/parameters/SignatureHeader'
      - $ref: '#/components/parameters/Correlation'
      requestBody:
        description: 'Parameters needed for confirmation of the Payment Request.

          Even though there is no parameter, a Json (void) body structure must be provided.

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationResource'
        required: true
      responses:
        '200':
          description: retrieval of the Payment Request enriched with the status report
          headers:
            X-Request-ID:
              description: 'Correlation header to be set in a request and retrieved in the relevant response

                '
              schema:
                type: string
            Digest:
              description: Digest of the body
              schema:
                type: string
            Signature:
              description: '[http-signature of the response ](https://datatracker.ietf.org/doc/draft-cavage-http-signatures/)

                The keyId must specify the way to get the relevant qualified certificate. It is requested that this identifier is an URL aiming to provide the relevant Qualified Certificate.

                '
              schema:
                type: string
            Warning:
              description: 'Warning header.

                This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

                '
              schema:
                type: string
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/HalPaymentRequest'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
        '406':
          $ref: '#/components/responses/406'
        '408':
