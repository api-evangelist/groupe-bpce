openapi: 3.2.0
info:
  title: Funds Availability CBPII API
  version: 1.4.2.20-b
  description: 'This API intends to provide an interface between

    - Account Servicing Payment Service Providers (ASPSP)

    - Third Party (Payment Service) Providers (TPP)


    TPP may act with different roles as described below:

    - Account Information Service Providers (AISP)

    - Payment Initiation Service Providers (PISP)

    - Card Based Payment Instrument Issuers (CBPII)


    The Payment Service User (PSU) is the owner of the accounts held by the ASPSP and gives accreditations to the TPP in order to access his accounts…'
  termsOfService: https://apistore.groupebpce.com/terms-of-use
  contact:
    name: BPCE
    url: https://apistore.groupebpce.com/support-technique
  license:
    name: Copyright BPCE
    url: https://apistore.groupebpce.com/regulatory-information
  x-business-exposure: true
  x-internal-id: BDSP2BC1
