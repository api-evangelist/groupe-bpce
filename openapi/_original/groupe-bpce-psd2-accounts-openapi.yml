        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '501':
          $ref: '#/components/responses/501'
      security:
      - accessCode:
        - aisp
      tags:
      - AISP
components:
  parameters:
    AccountResourceIdentification:
      name: accountResourceId
      description: Identification of account resource to fetch
      in: path
      required: true
      schema:
        type: string
        pattern: ^([a-zA-Z0-9_ /\-?:\()\.,']{1,100})$
    AuthorizationParameter:
      name: Authorization
      description: Access token to be passed as a header
      in: header
      required: true
      schema:
        type: string
    Correlation:
      name: X-Request-ID
      description: 'Correlation header to be set in a request and retrieved in the relevant response

        '
      in: header
      required: true
      schema:
        type: string
        maxLength: 70
    DateType:
      name: dateType
      description: 'This parameter specifies the type of date on which [dateFrom] and [dateTo] apply.

        If not provided, the ASPSP will use its own default date type as specified in its implementation documentation.

        The implementation documentation must also specify which date types are supported.

        '
      in: query
      required: false
      schema:
        type: string
        enum:
        - transactionDate
        - bookingDate
    DigestHeader:
      name: Digest
      description: Digest of the body
      in: header
      required: false
      schema:
        type: string
    FromEntryReference:
      name: entryReferenceFrom
      description: 'Specifies the value on which the result has to be computed.


        Only the transaction having a technical identification greater than this value must be included within the result

        '
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
    FromImputationDate:
      name: dateFrom
      description: 'Inclusive minimal imputation date of the transactions.


        Transactions having an imputation date equal to this parameter are included within the result.

        '
      in: query
      required: false
      schema:
        type: string
        format: date-time
    PsuAcceptCharsetHeader:
      name: PSU-Accept-Charset
      description: '"Accept-Charset" header field sent by the PSU terminal when connecting to the TPP

        '
      in: header
      schema:
        type: string
    PsuAcceptEncodingHeader:
      name: PSU-Accept-Encoding
      description: '"Accept-Encoding" header field sent by the PSU terminal when connecting to the TPP

        '
      in: header
      schema:
        type: string
    PsuAcceptHeader:
      name: PSU-Accept
      description: '"Accept" header field sent by the PSU terminal when connecting to the TPP

        '
      in: header
      schema:
        type: string
    PsuAcceptLanguageHeader:
      name: PSU-Accept-Language
      description: '"Accept-Language" header field sent by the PSU terminal when connecting to the TPP

        '
      in: header
      schema:
        type: string
    PsuDateHeader:
      name: PSU-Date
      description: Timestamp of the most relevant PSU’s terminal request to the TTP
      in: header
      schema:
        type: string
    PsuDeviceId:
      name: PSU-Device-ID
      description: 'UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available.

        UUID identifies either a device or a device dependant application installation.

        In case of installation identification this ID need to be unaltered until removal from device.

        '
      in: header
      schema:
        type: string
    PsuGeoLocation:
      name: PSU-GEO-Location
      description: Geographical location of the PSU as provided by the PSU mobile terminal if any to the TPP
      in: header
      schema:
        type: string
    PsuHttpMethodHeader:
      name: PSU-HTTP-Method
      description: Http method for the most relevant PSU’s terminal request to the TTP
      in: header
      schema:
        type: string
    PsuIpAddressHeader:
      name: PSU-IP-Address
      description: IP address used by the PSU's terminal when connecting to the TPP
      in: header
      schema:
        type: string
    PsuIpPortHeader:
      name: PSU-IP-Port
      description: IP port used by the PSU's terminal when connecting to the TPP
      in: header
      schema:
        type: string
    PsuRefererHeader:
      name: PSU-Referer
      description: '"Referer" header field sent by the PSU terminal when connecting to the TPP.

        Notice that an initial typo in RFC 1945 specifies that "referer" (incorrect spelling) is to be used. The correct spelling "referrer" can be used but might not be understood.

        '
      in: header
      schema:
        type: string
    PsuUserAgentHeader:
      name: PSU-User-Agent
      description: '"User-Agent" header field sent by the PSU terminal when connecting to the TPP

        '
      in: header
      schema:
        type: string
    SignatureHeader:
      name: Signature
      description: '[http-signature of the request](https://datatracker.ietf.org/doc/draft-cavage-http-signatures/)

        The keyId must specify the way to get the relevant qualified certificate. It is requested that this identifier is an URL aiming to provide the relevant Qualified Certificate.

        '
      in: header
      required: true
      schema:
        type: string
    ToEntryReference:
      name: entryReferenceto
      description: 'Specifies the value on which the result has to be computed.


        Only the transaction having a technical identification less than or equal to this value must be included within the result

        '
      in: query
      required: false
      schema:
        type: string
        maxLength: 40
    ToImputationDate:
      name: dateTo
      description: 'Exclusive maximal imputation date of the transactions.


        Transactions having an imputation date equal to this parameter are not included within the result.

        '
      in: query
      required: false
      schema:
        type: string
        format: date-time
    TransactionResourceIdentification:
      name: transactionResourceId
      description: Identification of transaction resource to fetch
      in: path
      required: true
      schema:
        type: string
        pattern: ^([a-zA-Z0-9_ /\-?:\()\.,']{1,100})$
    Workspace:
      name: workspace
      description: 'Workspace to be used for processing an AISP request.

        If not provided, the default workspace is computed from the authentication that was used for getting the OAuth2 Access Token.

        '
      in: query
      schema:
        type: string
        maxLength: 32
  responses:
    '204':
      description: No content.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
    '400':
      description: Invalid status value
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '401':
      description: Unauthorized, authentication failure.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '403':
      description: Forbidden, authentication successful but access to resource is not allowed.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '404':
      description: Not found, no request available.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '405':
      description: Method Not Allowed.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '406':
      description: Not Acceptable.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '408':
      description: Request Timeout.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '429':
      description: Too many requests.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
        Warning:
          description: 'Warning header.

            This header can be used by the server to inform the client of a deprecated entry-point through the value "299" value and a descriptive message.

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '500':
      description: Internal server error.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '501':
      description: 'Not Implemented.

        This code should be used when the entry point is implemented but cannot provide a result, given the context.

        When the entry point is not implemented at all, HTTP400 will be returned.

        '
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
    '503':
      description: Service unavailable.
      headers:
        X-Request-ID:
          description: 'Correlation header to be set in a request and retrieved in the relevant response

            '
          schema:
            type: string
      content:
        application/json; charset=utf-8:
          schema:
            $ref: '#/components/schemas/ErrorModel'
  schemas:
    Access:
      description: Requested access services.
      type: object
      properties:
        owners:
          $ref: '#/components/schemas/AccessibleAccounts'
        balances:
          $ref: '#/components/schemas/AccessibleAccounts'
        transactions:
          $ref: '#/components/schemas/AccessibleAccounts'
        overdrafts:
          $ref: '#/components/schemas/AccessibleAccounts'
        trustedBeneficiaries:
          description: 'Indicator that access to the trusted beneficiaries list was granted or not to the AISP by the PSU

            - true: the access was granted

            - false: the access was not granted

            '
          type: boolean
        trustedWorkspaceBeneficiaries:
          description: "Indicator, for each given workspace, that access to the trusted beneficiaries list was granted or not to the AISP by the PSU \n"
          type: array
          items:
            $ref: '#/components/schemas/AccessibleTrustedBeneficiaries'
        psuIdentity:
          description: 'Indicator that access to the PSU identity, first name and last name, was granted or not to the AISP by the PSU

            - true: the access was granted

            - false: the access was not granted

            '
          type: boolean
      required:
      - owners
      - balances
      - transactions
      - psuIdentity
      example: "{\n  \"owners\" : [ ],\n  \"balances\" : [ {\n    \"other\" : {\n      \"identification\" : \"Alias1\",\n      \"schemeName\" : \"BANK\",\n      \"issuer\" : \"BNKAFRPPXXX\"\n    },\n    \"currency\" : \"EUR\"\n  }, {\n    \"other\" : {\n      \"identification\" : \"Alias2\",\n      \"schemeName\" : \"BANK\",\n      \"issuer\" : \"BNKAFRPPXXX\"\n    },\n    \"currency\" : \"EUR\"\n  } ],\n  \"transactions\" : [ {\n    \"other\" : {\n      \"identification\" : \"Alias1\",\n      \"schemeName\" : \"BANK\",\n      \"issuer\" : \"BNKAFRPPXXX\"\n    },\n    \"currency\" : \"EUR\"\n  } ],\n  \"trustedBeneficiaries\" : \"true\",\n  \"psuIdentity\" : true\n}"
    AccessibleAccounts:
      description: List of accessible accounts for one given functionality
      type: array
      items:
        $ref: '#/components/schemas/AccountIdentification'
      example: "{\n  \"workspace\": \"PRIV\",\n  \"access\": true\n}"
    AccessibleTrustedBeneficiaries:
      description: list of workspaces for which the PSU has given consent to the access by the AISP
      type: object
      properties:
        workspace:
          description: 'Identification of the workspace.

            If not provided, the default workspace is computed from the authentication that was used for getting the OAuth2 Access Token.

            '
          type: string
          maxLength: 32
        access:
          description: 'Indicator that access to the trusted beneficiaries list was granted or not to the AISP by the PSU for the default workspace

            - true: the access was granted

            - false: the access was not granted

            '
          type: boolean
      example: "{\n  \"workspace\" : \"PRO_1\",\n  \"access\" : \"true\"\n}"
    AccountIdentification:
      description: 'Unique and unambiguous identification for the account between the account owner and the account servicer.

        Card accounts must provide the identification of the card through the "other" substructure by giving, for instance, the masked PAN (MPAN).

        The currency used for the account, when needed, can be specified through the [currency] field.

        '
      type: object
      properties:
        workspace:
          description: 'Workspace to which the account is linked.

            This workspace might be specified by the AISP when forwarding the consent on accounts.

            If not provided, the default workspace is computed from the authentication that was used for getting the OAuth2 Access Token.

            '
          type: string
          maxLength: 32
        iban:
          description: 'ISO20022: International Bank Account Number (IBAN) - identification used internationally by financial institutions to uniquely identify the account of a customer.


            Further specifications of the format and content of the IBAN can be found in the standard ISO 13616 "Banking and related financial services - International Bank Account Number (IBAN)" version 1997-10-01, or later revisions.

            '
          type: string
          pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
        other:
          $ref: '#/components/schemas/GenericIdentification'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      example: "{\n  \"workspace\": \"PRO_1\",\n  \"iban\" : \"YY64COJH41059545330222956960771321\",\n  \"currency\" : \"EUR\"\n}"
    AccountLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | owners | link to the owners identities for a given account |

        | balances | link to the balances of a given account |

        | transactions | link to the transactions of a given account |

        | overdrafts | link to the lists of overdrafts of a given account |

        '
      type: object
      properties:
        owners:
          $ref: '#/components/schemas/GenericLink'
        balances:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
        overdrafts:
          $ref: '#/components/schemas/GenericLink'
      readOnly: true
      example: "{\n  \"balances\" : {\n    \"href\" : \"/v1/accounts/Alias1/balances\"\n  },\n  \"transactions\" : {\n    \"href\" : \"/v1/accounts/Alias1/transactions\"\n  },\n  \"overdrafts\" : {\n    \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n  }\n}"
    AccountListLinks:
      description: 'Links that can be used for further navigation when browsing Account Information at top level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the list of all available accounts |

        | consents | link to the consents forwarding |

        | endUserIdentity | link to the end-user identity|

        | trustedBeneficiaries | link to the list of trusted beneficiaries |

        | worspaces | array of link to each relevant workspaces |

        | first | link to the first page of the accounts result |

        | last | link to the last page of the accounts result |

        | next | link to the next page of the accounts result |

        | prev | link to the previous page of the accounts result |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        consents:
          $ref: '#/components/schemas/GenericLink'
        endUserIdentity:
          $ref: '#/components/schemas/GenericLink'
        trustedBeneficiaries:
          $ref: '#/components/schemas/GenericLink'
        workspaces:
          description: list of all workspaces that can be accessed by the PSU
          type: array
          items:
            $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"/v1/accounts\"\n  },\n  \"consents\" : {\n    \"href\" : \"/v1/consents\"\n  },\n  \"endUserIdentity\" : {\n    \"href\" : \"v1/end-user-identity\"\n  },\n  \"trustedBeneficiaries\" : {\n    \"href\" : \"/v1/trusted-beneficiaries\"\n  },\n  \"workspaces\": [\n    {\n      \"href\": \"v1/accounts?worspace=PRO_1\",\n      \"templated\": true\n    },\n    {\n      \"href\": \"v1/accounts?worspace=PRO_2\",\n      \"templated\": true\n    }\n  ]\n}"
    AccountResource:
      description: 'PSU account that is made available to the TPP. 

        The ASPSP is able to set up specific accounts in order to provide card transactions with a delayed debit.  

        This account must be specific to a given card. Consequently, when the card is renewed, a new account will be set up. 

        ASPSP might also set-up different accounts for one given card but with different imputation dates. The remanence of these accounts is up to the ASPSP but must be equal or greater than the one which is provided through the Web-Banking interface. 

        Case a payment card is blocked, any relevant information (balances, transactions...) that is available through the ASPSP PSU-interfaces must also be available through the API till the end of remanence period.

        '
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        bicFi:
          description: 'ISO20022: Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identification code (BIC)".

            '
          type: string
          pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
        accountId:
          $ref: '#/components/schemas/AccountIdentification'
        name:
          description: 'Label of the PSU account

            In case of a delayed debit card transaction set, the name shall specify the holder name and can also provide the imputation date

            '
          type: string
          maxLength: 70
        details:
          description: 'Specifications that might be provided by the ASPSP

            - characteristics of the account

            - characteristics of the relevant card

            '
          type: string
          maxLength: 140
        linkedAccount:
          description: 'Case of a set of pending card transactions, the ASPSP will provide the relevant cash account the card is set up on.

            When used, this field must be valued with the resourceId of the relevant cash account.

            '
          type: string
          maxLength: 70
        usage:
          description: 'Specifies the usage of the account

            | Code | Description |

            | ---- | ----------- |

            | PRIV | Private personal account |

            | ORGA | Professional account |

            Case of a set of pending card transactions, this field does not have to be set since the usage is inherited from the linked account.

            '
          type: string
          enum:
          - PRIV
          - ORGA
        cashAccountType:
          description: 'Specifies the type of the account

            | Code | Description |

            | ---- | ----------- |

            | CACC | Cash account |

            | CARD | List of card based transactions |

            '
          type: string
          enum:
          - CACC
          - CARD
        product:
          description: 'Product Name of the Bank for this account, proprietary definition

            '
          type: string
          maxLength: 35
        balances:
          description: list of balances provided by the ASPSP
          type: array
          items:
            $ref: '#/components/schemas/BalanceResource'
          minItems: 1
        psuStatus:
          $ref: '#/components/schemas/PsuStatusType'
        _links:
          $ref: '#/components/schemas/AccountLinks'
      required:
      - name
      - cashAccountType
      - _links
      example: "{\n  \"resourceId\" : \"Alias1\",\n  \"bicFi\" : \"BNKAFRPPXXX\",\n  \"accountId\" : {\n    \"iban\" : \"YY64COJH41059545330222956960771321\",\n    \"currency\" : \"EUR\"\n  },\n  \"name\" : \"Compte de Mr et Mme Dupont\",\n  \"usage\" : \"PRIV\",\n  \"cashAccountType\" : \"CACC\",\n  \"psuStatus\" : \"Co-account Holder\",\n  \"_links\" : {\n    \"balances\" : {\n      \"href\" : \"/v1/accounts/Alias1/balances\"\n    },\n    \"transactions\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions\"\n    },\n    \"overdrafts\" : {\n      \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n    }\n  }\n}"
    AmountAndCurrencyExchange:
      description: 'Provides detailed information on the original amount.

        The [instructedAmount] property identifies the amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party and provides currency exchange information in case the instructed amount and/or currency is/are different from the entry amount and/or currency.

        The [transactionAmount] property identifies the amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party and provides currency exchange information in case the instructed amount and/or currency is/are different from the entry amount and/or currency.

        The [cunterValueAmount] property embbeds the set of elements used to provide the countervalue amount and currency exchange information.

        - This can be either the counter amount quoted in an FX deal, or the result of the currency information applied to an instructed amount, before deduction of charges.

        The [announcedPostingAmount] property specifies the amount of money, based on terms of corporate action event and balance of underlying securities, entitled to/from the account owner.

        - In some situations, this amount may alternatively be called entitled amount.

        '
      type: object
      properties:
        instructedAmount:
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        transactionAmount:
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        counterValueAmount:
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        announcedPostingAmount:
          $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
        proprietaryAmount:
          description: 'Set of elements used to provide information on the original amount and currency exchange.

            '
          type: array
          items:
            $ref: '#/components/schemas/AmountAndCurrencyExchangeDetails'
      example: "{\n  \"instructedAmount\" : {\n    \"type\" : \"Contract\",\n    \"amount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    },\n    \"sourceCurrency\" : \"EUR\",\n    \"targetCurrency\" : \"USD\",\n    \"unitCurrency\" : \"EUR\",\n    \"exchangeRate\" : 1.1,\n    \"contractIdentification\" : \"Ctrct4XG56\",\n    \"quotationDate\" : \"2020-02-17\"\n  }\n}"
    AmountAndCurrencyExchangeDetails:
      description: 'ISO20022: details on amount and currency exchange

        The [amount] property is the amount of money to be exchanged against another amount of money in the counter currency.

        The [sourceCurency] property indicates the currency from which an amount is to be converted in a currency conversion.

        The [targetCurrency] property indicates the currency into which an amount is to be converted in a currency conversion.

        The [unitCurrency] indicates the currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        type:
          description: specifies the type of amount in case of proprietary amount
          type: string
          maxLength: 35
        amount:
          $ref: '#/components/schemas/AmountType'
        sourceCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        targetCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        unitCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        exchangeRate:
          description: 'Factor used to convert an amount from one currency into another. This reflects the price at which one currency was bought with another currency.

            ExchangeRate expresses the ratio between UnitCurrency and QuotedCurrency (ExchangeRate = UnitCurrency/QuotedCurrency).

            '
          type: number
          format: float
        contractIdentification:
          description: Unique identification to unambiguously identify the foreign exchange contract.
          type: string
          maxLength: 35
        quotationDate:
          description: Date and time at which an exchange rate is quoted.
          type: string
          format: date
      required:
      - amount
      - sourceCurrency
      - exchangeRate
      example: "{\n  \"type\" : \"Contract\",\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  },\n  \"sourceCurrency\" : \"EUR\",\n  \"targetCurrency\" : \"USD\",\n  \"unitCurrency\" : \"EUR\",\n  \"exchangeRate\" : 1.1,\n  \"contractIdentification\" : \"Ctrct4XG56\",\n  \"quotationDate\" : \"2020-02-17\"\n}"
    AmountType:
      description: 'Structure aiming to embed the amount and the currency to be used.

        '
      type: object
      properties:
        amount:
          description: 'ISO20022: Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.

            '
          type: number
          format: float
          pattern: ^\-{0,1}[0-9]{1,13}(\.[0-9]{0,5}){0,1}$
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      required:
      - amount
      - currency
      example: "{\n  \"amount\" : 123.45,\n  \"currency\" : \"EUR\"\n}"
    BalanceResource:
      description: Structure of an account balance
      type: object
      properties:
        name:
          description: Label of the balance
          type: string
          maxLength: 70
        balanceAmount:
          $ref: '#/components/schemas/AmountType'
        balanceType:
          $ref: '#/components/schemas/BalanceStatus'
        lastChangeDateTime:
          description: Timestamp of the last change of the balance amount
          type: string
          format: date-time
        referenceDate:
          description: Reference date for the balance
          type: string
          format: date-time
        lastCommittedTransaction:
          description: 'Identification of the last committed transaction. This is actually useful for instant balance.

            '
          type: string
          maxLength: 40
      required:
      - name
      - balanceAmount
      - balanceType
      example: "{\n  \"name\" : \"Solde comptable au 12/01/2017\",\n  \"balanceAmount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  },\n  \"balanceType\" : \"CLBD\",\n  \"lastCommittedTransaction\" : \"A452CH\"\n}"
    BalancesLinks:
      description: 'links that can be used for further navigation when browsing balances Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the balances of a given account |

        | parent-list | link to the list of all available accounts |

        | owners | link to the owners identities for a given account |

        | transactions | link to the transactions of a given account |

        | overdrafts | link to the lists of overdrafts of a given account |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        owners:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
        overdrafts:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"/v1/accounts/myAccountId/balances\"\n  },\n  \"parent-list\" : {\n    \"href\" : \"/v1/accounts\"\n  },\n  \"transactions\" : {\n    \"href\" : \"/v1/accounts/myAccountId/transactions\"\n  },\n  \"overdrafts\" : {\n    \"href\" : \"/v1/accounts/myAccountId/overdrafts\"\n  }\n}"
    BalanceStatus:
      description: 'Type of balance

        | Code | Name | Description |

        | ---- | ---- | ----------- |

        | CLBD | ISO20022 ClosingBooked | Balance of the account at the end of the pre-agreed account reporting period. It is the sum of the opening booked balance at the beginning of the period and all entries booked to the account during the pre-agreed account reporting period.  |

        | PRCD | ISO20022 PreviouslyClosedBooked | Balance of the account at the previously closed account reporting period. The opening booked balance for the new period has to be equal to this balance. Usage: the previously booked closing balance should equal (inclusive date) the booked closing balance of the date it references and equal the actual booked opening balance of the current date. |

        | ITAV | ISO20022 InterimAvailable | Available balance calculated in the course of the account servicer''s business day, at the time specified, and subject to further changes during the business day. The interim balance is calculated on the basis of booked credit and debit items during the calculation time/period specified.  |

        | XPCD | ISO20022 Expected | Balance, composed of booked entries and pending items known at the time of calculation, which projects the end of day balance if everything is booked on the account and no other entry is posted.  |

        | VALU | (None) | Value-date balance |

        | OTHR | (None) | Other Balance |

        '
      type: string
      enum:
      - CLBD
      - XPCD
      - VALU
      - OTHR
      - PRCD
      - ITAV
    BankTransactionCode:
      description: "Set of elements used to fully identify the type of underlying transaction resulting in an entry.\n\nISO20022 provides a list of [possible Bank Transaction Code combinations](https://www.iso20022.org/external_code_list.page)\n\nTransaction codification might also be specified at national community level.\n\nFor instance a French Transaction codification is [available](https://www.cfonb.org/fichiers/20190913092943_Brochure_Codes_Operation_pour_restitutions_clienteles_V5_0_novembre_2018.pdf)\n\nIt applies with § 2 code table using the following mapping:\n  - domain must be set with \"FR\"\n  - family must be set with one of the values that are provided in the [code Famille] column (e.g. \"OPCA\")\n  - subFamily must be set with one of the values that are provided in the [code opération] column (e.g. \"05\")\n  - code might be set with a proprietary transaction code that must be documented by the implementation.\n"
      type: object
      properties:
        domain:
          description: 'Set of elements used to provide the domain, the family and the sub-family of the bank transaction code, in a structured and hierarchical format.

            '
          type: string
          maxLength: 4
        family:
          description: 'Specifies the family and the sub-family of the bank transaction code, within a specific domain, in a structured and hierarchical format.

            '
          type: string
          maxLength: 4
        subFamily:
          description: 'Specifies the sub-product family within a specific family.

            '
          type: string
          maxLength: 4
        code:
          description: 'Proprietary bank transaction code to identify the underlying transaction.

            '
          type: string
          maxLength: 35
        issuer:
          description: 'Identification of the issuer of the proprietary bank transaction code.

            '
          type: string
          maxLength: 35
      required:
      - domain
      - family
      - subFamily
      example: "{\n  \"domain\" : \"PMNT\",\n  \"family\" : \"CCRD\",\n  \"subFamily\" : \"POSC\"\n}"
    BeneficiariesLinks:
      description: 'links that can be used for further navigation when browsing Account Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the list of trusted beneficiaries |

        | accounts | link to the list of all available accounts |

        | consents | link to the consents forwarding |

        | endUserIdentity | link to the end-user identity |

        | first | link to the first page of the beneficiaries result |

        | last | link to the last page of the beneficiaries result |

        | next | link to the next page of the beneficiaries result |

        | prev | link to the previous page of the beneficiaries result |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        accounts:
          $ref: '#/components/schemas/GenericLink'
        consents:
          $ref: '#/components/schemas/GenericLink'
        endUserIdentity:
          $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"/v1/trusted-beneficiaries\"\n  },\n  \"accounts\" : {\n    \"href\" : \"/v1/accounts\"\n  }\n}"
    Beneficiary:
      description: Specification of a beneficiary
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        id:
          description: Id of the beneficiary
          type: string
          pattern: ^([a-zA-Z0-9 /\-?:\()\.,']{1,36})$
        isTrusted:
          description: 'The ASPSP having not implemented the trusted beneficiaries list must not set this flag.

            Otherwise, the ASPSP indicates whether or not the beneficiary was registered by the PSU within the trusted beneficiaries list.

            - true: the beneficiary is actually a trusted beneficiary

            - false: the beneficiary is not a trusted beneficiary

            '
          type: boolean
          readOnly: true
        creditorAgent:
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        creditor:
          $ref: '#/components/schemas/PartyIdentification'
        creditorAccount:
          $ref: '#/components/schemas/AccountIdentification'
      required:
      - creditor
      example: "{\n  \"creditor\" : {\n    \"name\" : \"myMerchant\",\n    \"postalAddress\" : {\n      \"country\" : \"FR\",\n      \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n    },\n    \"organisationId\" : {\n      \"identification\" : \"852126789\",\n      \"schemeName\" : \"SIREN\",\n      \"issuer\" : \"FR\"\n    }\n  },\n  \"creditorAccount\" : {\n    \"iban\" : \"YY64COJH41059545330222956960771321\",\n    \"currency\" : \"EUR\"\n  }\n}"
    ChargeBearerCode:
      description: 'ISO20022: Specifies which party/parties will bear the charges associated with the processing of the payment transaction.

        The following values are allowed:

        | Code | Name | Description |

        | ---- | ---- | ---------- |

        | DEBT | BorneByDebtor | All transaction charges are to be borne by the debtor. |

        | CRED | BorneByCreditor | All transaction charges are to be borne by the creditor. |

        | SHAR | Shared | In a credit transfer context, means that transaction charges on the sender side are to be borne by the debtor, transaction charges on the receiver side are to be borne by the creditor. In a direct debit context, means that transaction charges on the sender side are to be borne by the creditor, transaction charges on the receiver side are to be borne by the debtor. |

        | SLEV | FollowingServiceLevel | Charges are to be applied following the rules agreed in the service level and/or scheme. |

        '
      type: string
      enum:
      - DEBT
      - CRED
      - SHAR
      - SLEV
    Charges:
      description: 'ISO20022: Provides further details on the charges related to the payment transaction.

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        totalChargesAndTaxAmount:
          $ref: '#/components/schemas/AmountType'
        record:
          description: Provides details of the individual charges record.
          type: array
          items:
            $ref: '#/components/schemas/ChargesRecord'
      example: "{\n  \"totalChargesAndTaxAmount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  },\n  \"record\" : [ {\n    \"amount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    },\n    \"creditDebitIndicator\" : \"DBIT\",\n    \"chargeIncludedIndicator\" : true,\n    \"code\" : {\n      \"code\" : \"CD01\",\n      \"issuer\" : \"MyIssuer\"\n    },\n    \"rate\" : 0.5,\n    \"bearer\" : \"SHAR\",\n    \"agent\" : {\n      \"bicFi\" : \"BNKAFRPPXXX\"\n    },\n    \"tax\" : {\n      \"identification\" : \"VAT\",\n      \"rate\" : 12.3,\n      \"amount\" : {\n        \"amount\" : 123.45,\n        \"currency\" : \"EUR\"\n      }\n    }\n  } ]\n}"
    ChargesRecord:
      description: "ISO20022: Provides further individual record details on the charges related to the payment transaction.\n- The [amount] proprty specifies the transaction charges to be paid by the charge bearer.\n- The [creditDebitIndicator] property indicates whether the charges amount is a credit or a debit amount.\n  A zero amount is considered to be a credit.\n- the [code] property is the charge type, in a coded form\n- the [rate] property is the rate used to calculate the amount of the charge or fee.\n- the [bearer] property specifies which party/parties will bear the charges associated with the processing of the payment transaction.\n- the [agent] property specifies the agent that takes the transaction charges or to which the transaction charges are due.\n- the [tax] property provides details on the tax applied to charges.\nAPI: Amounts must always be set as positive values.\n"
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountType'
        creditDebitIndicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        chargeIncludedIndicator:
          description: "Indicates whether the charge should be included in the amount or is added as pre-advice.\nOne of the following values must be used:\n  - Meaning When True: Included\n  - Meaning When False: Pre-advised\n"
          type: boolean
        code:
          $ref: '#/components/schemas/CodeAndIssuer'
        rate:
          $ref: '#/components/schemas/PercentageRate'
        bearer:
          $ref: '#/components/schemas/ChargeBearerCode'
        agent:
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        tax:
          $ref: '#/components/schemas/TaxCharges'
      example: "{\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  },\n  \"creditDebitIndicator\" : \"DBIT\",\n  \"chargeIncludedIndicator\" : true,\n  \"code\" : {\n    \"code\" : \"CD01\",\n    \"issuer\" : \"MyIssuer\"\n  },\n  \"rate\" : 0.5,\n  \"bearer\" : \"SHAR\",\n  \"agent\" : {\n    \"bicFi\" : \"BNKAFRPPXXX\"\n  },\n  \"tax\" : {\n    \"identification\" : \"VAT\",\n    \"rate\" : 12.3,\n    \"amount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    }\n  }\n}"
    ClearingSystemMemberIdentification:
      description: 'ISO20022: Information used to identify a member within a clearing system.

        API: to be used for some specific international credit transfers in order to identify the beneficiary bank

        '
      type: object
      properties:
        clearingSystemId:
          description: 'ISO20022: Specification of a pre-agreed offering between clearing agents or the channel through which the payment instruction is processed.

            '
          type: string
          maxLength: 35
        memberId:
          description: 'ISO20022: Identification of a member of a clearing system.

            '
          type: string
          maxLength: 35
      required:
      - clearingSystemId
      - memberId
      example: "{\n  \"clearingSystemId\" : \"NZNCC\",\n  \"memberId\" : \"020368\"\n}"
    CodeAndIssuer:
      description: 'Specifies a code and the issuer of this code.

        '
      type: object
      properties:
        code:
          description: Provides the code.
          type: string
          maxLength: 4
        issuer:
          description: Identification of the issuer of the code.
          type: string
          maxLength: 35
      required:
      - code
      example: "{\n  \"code\" : \"CD01\",\n  \"issuer\" : \"MyIssuer\"\n}"
    ContactDetails:
      description: 'Indicates how to contact the party.

        '
      type: object
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        faxNumber:
          $ref: '#/components/schemas/PhoneNumber'
        emailAddress:
          description: email address of the contact
          type: string
          pattern: ^.+@.+$
          maxLength: 2048
      example: "{\n  \"emailAddress\" : \"John.doe@john-doe.com\"\n}"
    CreditDebitIndicator:
      description: 'Accounting flow of the amount

        | Code | Description |

        | ---- | ----------- |

        | CRDT | Credit type amount |

        | DBIT | Debit type amount |

        '
      type: string
      enum:
      - CRDT
      - DBIT
    CreditorReferenceInformation:
      description: Reference information provided by the creditor to allow the identification of the underlying documents.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CodeAndIssuer'
        reference:
          description: Unique reference, as assigned by the creditor, to unambiguously refer to the payment transaction.
          type: string
          maxLength: 35
      example: "{\n  \"type\" : {\n    \"code\" : \"CD01\",\n    \"issuer\" : \"MyIssuer\"\n  },\n  \"reference\" : \"CredRef56FH6\"\n}"
    CurrencyCode:
      description: 'Specifies the currency of the amount or of the account.

        A code allocated to a currency by a Maintenance Agency under an international identification scheme, as described in the latest edition of the international standard ISO 4217 "Codes for the representation of currencies and funds".

        '
      type: string
      pattern: ^[A-Z]{3,3}$
    DateAndPlaceOfBirth:
      description: 'Date and place of birth of a person.

        This information must be requested for detection of Fraud, Money-Laundering and Terrorism Financing in case of international payment.

        '
      type: object
      properties:
        birthDate:
          description: Date on which a person is born.
          type: string
          format: date
        cityOfBirth:
          description: City where a person was born.
          type: string
          maxLength: 35
        countryOfBirth:
          description: Country where a person was born.
          type: string
          pattern: ^[A-Z]{2,2}$
      required:
      - birthDate
      - cityOfBirth
      - countryOfBirth
      example: "{\n  \"birthDate\" : \"1985-02-19\",\n  \"cityOfBirth\" : \"Paris\",\n  \"countryOfBirth\" : \"FR\"\n}"
    DocumentAdjustment:
      description: 'ISO20022: Specifies detailed information on the amount and reason of the adjustment.

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/AmountType'
        creditDebitIndicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        reason:
          description: Specifies the reason for the adjustment.
          type: string
          maxLength: 4
        additionalInformation:
          description: Provides further details on the document adjustment.
          type: string
          maxLength: 140
      required:
      - amount
      example: "{\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  },\n  \"creditDebitIndicator\" : \"CRDT\",\n  \"reason\" : \"RFND\",\n  \"additionalInformation\" : \"Some comment\"\n}"
    DocumentLineIdentification:
      description: 'Provides identification of the document line.

        the [type] property must be used for specifying the type of referred document type.

        '
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CodeAndIssuer'
        number:
          description: Unique and unambiguous identification of the referred document line.
          type: string
          maxLength: 35
        relatedDate:
          description: Date associated with the referred document line.
          type: string
          format: date
      example: "{\n  \"type\" : {\n    \"code\" : \"CD01\",\n    \"issuer\" : \"MyIssuer\"\n  },\n  \"number\" : \"1\",\n  \"relatedDate\" : \"2020-02-09\"\n}"
    EndDate:
      description: 'The last applicable day of execution for a given period.

        If not given, the period is considered as endless.

        '
      type: string
      format: date-time
    EndToEndId:
      description: 'ISO20022: Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.

        '
      type: string
      pattern: ^([a-zA-Z0-9 /\-?:\()\.,']{1,36})$
    EndUserIdentityLinks:
      description: 'links that can be used for further navigation after retrieving end-user identity

        | Link | Description |

        | ---- | ----------- |

        | self | link to the end-user identity |

        | accounts | link to the list of all available accounts |

        | consents | link to the consents forwarding |

        | trustedBeneficiaries | link to the list of trusted beneficiaries |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        accounts:
          $ref: '#/components/schemas/GenericLink'
        consents:
          $ref: '#/components/schemas/GenericLink'
        trustedBeneficiaries:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"v1/end-user-identity\"\n  },\n  \"accounts\" : {\n    \"href\" : \"/v1/accounts\"\n  },\n  \"consents\" : {\n    \"href\" : \"/v1/consents\"\n  },\n  \"trustedBeneficiaries\" : {\n    \"href\" : \"/v1/trusted-beneficiaries\"\n  }\n}"
    ErrorDetail:
      description: detailed error description
      type: object
      properties:
        location:
          description: Location of the erroneous parameter when not in request body
          type: string
          enum:
          - header
          - query
        name:
          description: Name of the erroneous parameter when not in request body
          type: string
        path:
          description: JsonPath of the erroneous request body property
          type: string
        erroneousValue:
          description: Erroneous parameter value
          type: string
        message:
          description: Relevant message for the erroneous parameter
          type: string
        expectedPattern:
          description: Expected pattern, if any, that the erroneous parameter does not match with
          type: string
        expectedValueRange:
          description: Expected value range, if any, that the erroneous parameter does not match with
          type: object
          example: "{\n  \"minValue\": 1,\n  \"maxValue\": 100\n}        "
          properties:
            minValue:
              type: integer
            maxValue:
              type: integer
        expectedValueCount:
          description: Expected value count, in the case of an array item, that the erroneous parameter does not match with
          type: object
          example: "{\n  \"minValue\": \"1\"\n}        "
          properties:
            minValue:
              type: integer
            maxValue:
              type: integer
        expectedEnumeration:
          description: Expected enumeration, if any, that the erroneous parameter do not match with
          type: array
          items:
            type: string
    ErrorModel:
      description: Generic error report structure
      type: object
      properties:
        timestamp:
          description: current timestamp
          type: string
          format: date-time
        status:
          description: HTTP error code
          type: integer
          format: int32
        error:
          description: HTTP error text
          type: string
          maxLength: 140
        message:
          description: HTTP textual reason phrase
          type: string
          maxLength: 140
        path:
          description: Relevant path that was used
          type: string
          maxLength: 140
        details:
          description: list of detailed errors that were encountered
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          minItems: 1
      required:
      - status
      - message
      example: "{\n  \"timestamp\" : \"2021-03-17T16:47:00.187248+01:00\",\n  \"status\" : 400,\n  \"error\" : \"Bad Request\",\n  \"message\" : \"This Authentication Approach is not available\",\n  \"details\" : [ {\n    \"path\" : \"$.supplementaryData.acceptedAuthenticationApproach\",\n    \"erroneousValue\" : \"EMBEDDED\",\n    \"expectedEnumeration\" : [ \"REDIRECT\", \"DECOUPLED\" ]\n  } ]\n}"
    ExecutionRule:
      description: 'Execution date shifting rule for standing orders

        This data attribute defines the behaviour when recurring payment dates falls on a weekend or bank holiday.

        The payment is then executed either the "preceding" or "following" working day.

        ASPSP might reject the request due to the communicated value, if rules in Online-Banking are not supporting

        this execution rule.

        | Code | Description |

        | ---- | ----------- |

        | FWNG | following |

        | PREC | preceding |

        '
      type: string
      enum:
      - FWNG
      - PREC
    FinancialInstitutionIdentification:
      description: 'ISO20022: Unique and unambiguous identification of a financial institution, as assigned under an internationally recognised or proprietary identification scheme.

        '
      type: object
      properties:
        bicFi:
          description: 'ISO20022: Code allocated to a financial institution by the ISO 9362 Registration Authority as described in ISO 9362 "Banking - Banking telecommunication messages - Business identification code (BIC)".

            '
          type: string
          pattern: ^[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}$
        clearingSystemMemberId:
          $ref: '#/components/schemas/ClearingSystemMemberIdentification'
        lei:
          $ref: '#/components/schemas/LeiIdentification'
        name:
          description: Name of the financial institution
          type: string
          maxLength: 140
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
      required:
      - bicFi
      example: "{\n  \"bicFi\" : \"BNKAFRPPXXX\"\n}"
    FrequencyCode:
      description: 'Frequency rule for standing orders.

        The following codes from the "EventFrequency7Code" of ISO 20022 are supported.

        | Code | Description |

        | ---- | ----------- |

        | DAIL | Daily |

        | WEEK | Weekly |

        | TOWK | EveryTwoWeeks |

        | MNTH | Monthly |

        | TOMN | EveryTwoMonths |

        | QUTR | Quarterly |

        | SEMI | SemiAnnual |

        | YEAR | Annual |

        However, each ASPSP might restrict these values into a subset if needed.

        '
      type: string
      enum:
      - DAIL
      - WEEK
      - TOWK
      - MNTH
      - TOMN
      - QUTR
      - SEMI
      - YEAR
    GenericIdentification:
      description: 'ISO20022: Unique identification of an account, a person or an organisation, as assigned by an issuer.

        API: The ASPSP will document which account reference type it will support.

        '
      type: object
      properties:
        identification:
          description: 'API: Identifier

            '
          type: string
          maxLength: 70
        schemeName:
          description: 'Name of the identification scheme.

            Possible values for the scheme name, partially based on ISO20022 external code list, are the following:

            | Code | Name | Description |

            | ---- | ---- | ----------- |

            | BANK | BankPartyIdentification | Unique and unambiguous assignment made by a specific bank or similar financial institution to identify a relationship as defined between the bank and its client. |

            | BBAN | BBANIdentifier | Basic Bank Account Number (BBAN) - identifier used nationally by financial institutions, ie, in individual countries, generally as part of a National Account Numbering Scheme(s), to uniquely identify the account of a customer. |

            | COID | CountryIdentificationCode) : Country authority given organisation identification (e.g., corporate registration number) |

            | SREN | SIREN | The SIREN number is a 9 digit code assigned by INSEE, the French National Institute for Statistics and Economic Studies, to identify an organisation in France. |

            | SRET | SIRET | The SIRET number is a 14 digit code assigned by INSEE, the French National Institute for Statistics and Economic Studies, to identify an organisation unit in France. It consists of the SIREN number, followed by a five digit classification number, to identify the local geographical unit of that entity. |

            | NIDN | NationalIdentityNumber | Number assigned by an authority to identify the national identity number of a person. |

            Other values are also permitted, for instance:

            | Code | Name | Description |

            | ---- | ---- | ----------- |

            | OAUT | OAUTH2 | OAUTH2 access token that is owned by the PISP being also an AISP and that can be used in order to identify the PSU |

            | CPAN | CardPan | Card PAN |

            | MPAN | MaskedPan | Card PAN where some digits were replaced for security reason |

            | TPAN | TokenizedPan | Token which was provided by a Token Service Provider (TSP) in order to obfuscate a real card PAN. The TSP must be identified in the issuer field |

            | TBAN | TokenizedIBAN | Token which was provided by a Token Service Provider (TSP) in order to obfuscate an IBAN. The TSP must be identified in the issuer field |

            Each implementation of the STET PSD2 API must specify in its own documentation which schemes can actually been used

            '
          type: string
          maxLength: 70
        issuer:
          description: 'ISO20022: Entity that assigns the identification. this could a country code or any organisation name or identifier that can be recognized by both parties

            '
          type: string
          maxLength: 35
      required:
      - identification
      - schemeName
      example: "{\n  \"identification\" : \"12FR5\",\n  \"schemeName\" : \"COID\",\n  \"issuer\" : \"ACPR\"\n}"
    GenericLink:
      description: hypertext reference
      type: object
      properties:
        href:
          description: URI to be used. HREF stands for Hypertext REFerence.
          type: string
          maxLength: 2000
        templated:
          description: 'This field must be set with "true"  when [href] is an URI template, i.e. with parameters that will be set by the client afterwards. Parameter fields must be included by the API server according to RFC6570.

            Otherwise, this property must be absent or set to false

            default value: false

            '
          type: boolean
      required:
      - href
      example: "{\n  \"href\" : \"/v1/accounts\"\n}"
    HalAccounts:
      description: HYPERMEDIA structure used for returning the list of the available accounts to the AISP
      type: object
      properties:
        accounts:
          description: 'List of PSU account that are made available to the TPP

            '
          type: array
          items:
            $ref: '#/components/schemas/AccountResource'
        _links:
          $ref: '#/components/schemas/AccountListLinks'
      required:
      - accounts
      - _links
      example: "{\n  \"accounts\" : [ {\n    \"workspace\": {\n      \"identification\" : \"PERSO\",\n      \"label\" : \"comptes personnels\"\n    },\n    \"resourceId\" : \"Alias1\",\n    \"bicFi\" : \"BNKAFRPPXXX\",\n    \"accountId\" : {\n      \"iban\" : \"YY64COJH41059545330222956960771321\",\n      \"currency\" : \"EUR\"\n    },\n    \"name\" : \"Compte de Mr et Mme Dupont\",\n    \"usage\" : \"PRIV\",\n    \"cashAccountType\" : \"CACC\",\n    \"psuStatus\" : \"Co-account Holder\",\n    \"_links\" : {\n      \"balances\" : {\n        \"href\" : \"/v1/accounts/Alias1/balances\"\n      },\n      \"transactions\" : {\n        \"href\" : \"/v1/accounts/Alias1/transactions\"\n      },\n      \"overdrafts\" : {\n        \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n      }\n    }\n  }, {\n    \"workspace\": {\n      \"identification\" : \"PERSO\",\n      \"label\" : \"comptes personnels\"\n    },\n    \"resourceId\" : \"Alias2\",\n    \"bicFi\" : \"BNKAFRPPXXX\",\n    \"accountId\" : {\n\
        \      \"iban\" : \"YY64COJH41059545330222956960771321\",\n      \"currency\" : \"EUR\"\n    },\n    \"name\" : \"Compte de Mme Dupont\",\n    \"usage\" : \"PRIV\",\n    \"cashAccountType\" : \"CACC\",\n    \"psuStatus\" : \"Account Holder\",\n    \"_links\" : {\n      \"balances\" : {\n        \"href\" : \"/v1/accounts/Alias2/balances\"\n      },\n      \"transactions\" : {\n        \"href\" : \"/v1/accounts/Alias2/transactions\"\n      },\n      \"overdrafts\" : {\n        \"href\" : \"/v1/accounts/Alias2/overdrafts\"\n      }\n    }\n  } ],\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"/v1/accounts\"\n\n    },\n    \"consents\" : {\n      \"href\" : \"/v1/consents\"\n\n    },\n    \"endUserIdentity\" : {\n      \"href\" : \"v1/end-user-identity\"\n    },\n    \"trustedBeneficiaries\" : {\n      \"href\" : \"/v1/trusted-beneficiaries\"\n    }\n  }\n}"
    HalBalances:
      description: HYPERMEDIA structure used for returning the list of the relevant balances for a given account to the AISP
      type: object
      properties:
        balances:
          description: List of account balances
          type: array
          items:
            $ref: '#/components/schemas/BalanceResource'
          minItems: 1
        _links:
          $ref: '#/components/schemas/BalancesLinks'
      required:
      - balances
      - _links
      example: "{\n  \"balances\" : [ {\n    \"name\" : \"Solde comptable au 12/01/2017\",\n    \"balanceAmount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    },\n    \"balanceType\" : \"CLBD\",\n    \"lastCommittedTransaction\" : \"A452CH\"\n  }, {\n    \"name\" : \"Solde instantané au 12/01/2017 20:13\",\n    \"balanceAmount\" : {\n      \"amount\" : 105.65,\n      \"currency\" : \"EUR\"\n    },\n    \"balanceType\" : \"XPCD\",\n    \"lastCommittedTransaction\" : \"A452D0\"\n  } ],\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"/v1/accounts/myAccountId/balances\"\n    },\n    \"parent-list\" : {\n      \"href\" : \"/v1/accounts\"\n    },\n    \"transactions\" : {\n      \"href\" : \"/v1/accounts/myAccountId/transactions\"\n    },\n    \"overdrafts\" : {\n      \"href\" : \"/v1/accounts/myAccountId/overdrafts\"\n    }\n  }\n}"
    HalBeneficiaries:
      description: HYPERMEDIA structure used for returning the list of the whitelisted beneficiaries
      type: object
      properties:
        beneficiaries:
          description: List of trusted beneficiaries
          type: array
          items:
            $ref: '#/components/schemas/Beneficiary'
        _links:
          $ref: '#/components/schemas/BeneficiariesLinks'
      required:
      - beneficiaries
      - _links
      example: "{\n  \"demoBeneficiaries\" : [ {\n    \"creditor\" : {\n      \"name\" : \"myMerchant\",\n      \"postalAddress\" : {\n        \"country\" : \"FR\",\n        \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n      },\n      \"organisationId\" : {\n        \"identification\" : \"852126789\",\n        \"schemeName\" : \"SIREN\",\n        \"issuer\" : \"FR\"\n      }\n    },\n    \"creditorAccount\" : {\n      \"iban\" : \"YY64COJH41059545330222956960771321\",\n      \"currency\" : \"EUR\"\n    }\n  } ],\n  \"beneficiaries\" : [ {\n    \"creditor\" : {\n      \"name\" : \"myMerchant\",\n      \"postalAddress\" : {\n        \"country\" : \"FR\",\n        \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n      },\n      \"organisationId\" : {\n        \"identification\" : \"852126789\",\n        \"schemeName\" : \"SIREN\",\n        \"issuer\" : \"FR\"\n      }\n    },\n    \"creditorAccount\" : {\n      \"iban\" : \"YY64COJH41059545330222956960771321\"\
        ,\n      \"currency\" : \"EUR\"\n    }\n  } ],\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"/v1/trusted-beneficiaries\"\n    },\n    \"accounts\" : {\n      \"href\" : \"/v1/accounts\"\n    }\n  }\n}"
    HalEndUserIdentity:
      description: 'HYPERMEDIA structure used for returning the identity of the PSU.

        The [identity] property specifies the identity of the PSU which has granted access to the AISP on the accounts data

        This information can be retrieved based on the PSU''s authentication that occurred during the OAUTH2 access token initialisation.

        '
      type: object
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        _links:
          $ref: '#/components/schemas/EndUserIdentityLinks'
      required:
      - identity
      - _links
      example: "{\n  \"identity\" : {\n    \"fullName\" : \"Mme Cécile Dupond\",\n    \"namePrefix\" : \"MADM\",\n    \"firstName\" : \"Cécile\",\n    \"lastName\" : \"Dupond\"\n  },\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"v1/end-user-identity\"\n    },\n    \"accounts\" : {\n      \"href\" : \"/v1/accounts\"\n    },\n    \"consents\" : {\n      \"href\" : \"/v1/consents\"\n    },\n    \"trustedBeneficiaries\" : {\n      \"href\" : \"/v1/trusted-beneficiaries\"\n    }\n  }\n}"
    HalOverdrafts:
      description: HYPERMEDIA structure used for returning the list of the overdrafts that can apply on a given account to the AISP
      type: object
      properties:
        overdrafts:
          $ref: '#/components/schemas/Overdraft'
        _links:
          $ref: '#/components/schemas/OverdraftsLinks'
      required:
      - overdrafts
      - _links
      example: "{\n  \"overdrafts\" : {\n    \"allowedAmount\" : {\n      \"amount\" : 30000.0,\n      \"currency\" : \"EUR\"\n    }\n  },\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n    },\n    \"parent-list\" : {\n      \"href\" : \"/v1/accounts\"\n    },\n    \"balances\" : {\n      \"href\" : \"/v1/accounts/Alias1/balances\"\n    },\n    \"transactions\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions\"\n    }\n  }\n}"
    HalOwners:
      description: 'HYPERMEDIA structure used for returning the identities of the account owners.

        These owners are either real persons or a company.

        - in the first case, the [identities] block must be used

        - in the second cas, the [company] property specifies the identity of the company owning the account.'
      type: object
      properties:
        company:
          $ref: '#/components/schemas/GenericIdentification'
        identities:
          description: 'identity of the account owners.

            '
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        _links:
          $ref: '#/components/schemas/OwnersLinks'
      required:
      - _links
      example: "{\n  \"identities\" : [ {\n    \"fullName\" : \"M. John Doe\",\n    \"namePrefix\" : \"MIST\",\n    \"firstName\" : \"John\",\n    \"lastName\" : \"Doe\"\n  } ],\n  \"_links\" : {\n    \"balances\" : {\n      \"href\" : \"/v1/accounts/Alias1/balances\"\n    },\n    \"transactions\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions\"\n    },\n    \"overdrafts\" : {\n      \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n    }\n  }\n}"
    HalTransactionDetails:
      description: HYPERMEDIA structure used for returning the details of a given transaction
      type: object
      properties:
        details:
          description: Details of the transactions
          type: array
          items:
            type: string
        _links:
          $ref: '#/components/schemas/TransactionDetailsLinks'
      required:
      - details
      - _links
      example: "{\n  \"details\": [\n    \"First detail\",\n    \"Second detail\"\n  ],\n  \"links\": {\n    \"transactions\": {\n      \"href\": \"/v1/accounts\"\n    },\n    \"accounts\": {\n      \"href\": \"/v1/accounts\"\n    }\n  }\n}"
    HalTransactions:
      description: HYPERMEDIA structure used for returning the list of the transactions for a given account to the AISP
      type: object
      properties:
        transactions:
          description: List of transactions
          type: array
          items:
            $ref: '#/components/schemas/TransactionResource'
        _links:
          $ref: '#/components/schemas/TransactionsLinks'
      required:
      - transactions
      - _links
      example: "{\n  \"transactions\" : [ {\n    \"entryReference\" : \"DHGF36DJ0\",\n    \"transactionAmount\" : {\n      \"amount\" : 12.25,\n      \"currency\" : \"EUR\"\n    },\n    \"creditDebitIndicator\" : \"DBIT\",\n    \"status\" : \"BOOK\",\n    \"bookingDate\" : \"2020-02-14T00:00+01:00\",\n    \"remittanceInformation\" : {\n      \"unstructured\" : [ \"Chèque n°XXXXXXX\" ]\n    }\n  }, {\n    \"entryReference\" : \"DHGF36DJ1\",\n    \"transactionAmount\" : {\n      \"amount\" : 66.38,\n      \"currency\" : \"EUR\"\n    },\n    \"creditDebitIndicator\" : \"DBIT\",\n    \"status\" : \"BOOK\",\n    \"bookingDate\" : \"2020-02-14T00:00+01:00\",\n    \"remittanceInformation\" : {\n      \"unstructured\" : [ \"Prélèvement ICS XXXXXXX\" ]\n    }\n  } ],\n  \"_links\" : {\n    \"self\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions\"\n    },\n    \"parent-list\" : {\n      \"href\" : \"/v1/accounts\"\n    },\n    \"balances\" : {\n      \"href\" : \"/v1/accounts/Alias1/balances\"\
        \n    },\n    \"overdrafts\" : {\n      \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n    },\n    \"last\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions?page=last\"\n    },\n    \"next\" : {\n      \"href\" : \"/v1/accounts/Alias1/transactions?page=next\"\n    }\n  }\n}"
    Identity:
      description: HYPERMEDIA structure used for returning the identity of the PSU
      type: object
      properties:
        fullName:
          description: 'Last name and first name

            '
          type: string
          maxLength: 140
        namePrefix:
          $ref: '#/components/schemas/NamePrefixCode'
        firstName:
          description: 'First name

            '
          type: string
          maxLength: 70
        lastName:
          description: 'Last name

            '
          type: string
          maxLength: 70
      required:
      - fullName
      example: "{\n  \"fullName\" : \"M. John Doe\",\n  \"namePrefix\" : \"MIST\",\n  \"firstName\" : \"John\",\n  \"lastName\" : \"Doe\"\n}"
    LeiIdentification:
      description: 'Legal Entity Identifier is a code allocated to a party as described in ISO 17442 "Financial Services - Legal Entity Identifier (LEI)".

        '
      type: string
      pattern: ^[A-Z0-9]{18,18}[0-9]{2,2}$
    LineDetail:
      description: Set of elements used to provide the content of the referred document line.
      type: object
      properties:
        identification:
          $ref: '#/components/schemas/DocumentLineIdentification'
        description:
          description: Description associated with the document line.
          type: string
          maxLength: 2048
        amount:
          $ref: '#/components/schemas/RemittanceAmount'
      example: "{\n  \"identification\" : {\n    \"type\" : {\n      \"code\" : \"CD01\",\n      \"issuer\" : \"MyIssuer\"\n    },\n    \"number\" : \"1\",\n    \"relatedDate\" : \"2020-02-09\"\n  },\n  \"description\" : \"Some comments\",\n  \"amount\" : {\n    \"remittedAmount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    }\n  }\n}"
    NamePrefixCode:
      description: 'Specifies the terms used to formally address a person.

        This field accepts the following code values

        | Code | Description |

        | ---- | ---------- |

        | DOCT | Doctor |

        | MADM | Madam |

        | MISS | Miss |

        | MIST | Mister |

        '
      type: string
      enum:
      - DOCT
      - MADM
      - MISS
      - MIST
    Overdraft:
      description: 'ISO20022: Overdraft characteristics

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        allowedAmount:
          $ref: '#/components/schemas/AmountType'
      required:
      - allowedAmount
      example: "{\n  \"allowedAmount\" : {\n    \"amount\" : 30000.0,\n    \"currency\" : \"EUR\"\n  }\n}"
    OverdraftsLinks:
      description: 'links that can be used for further navigation when browsing overdrafts Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the overdrafts of a given account |

        | parent-list | link to the list of all available accounts |

        | owners | link to the owners identities for a given account |

        | balances | link to the balances of a given account |

        | transactions | link to the transactions of a given account |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        owners:
          $ref: '#/components/schemas/GenericLink'
        balances:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n  },\n  \"parent-list\" : {\n    \"href\" : \"/v1/accounts\"\n  },\n  \"balances\" : {\n    \"href\" : \"/v1/accounts/Alias1/balances\"\n  },\n  \"transactions\" : {\n    \"href\" : \"/v1/accounts/Alias1/transactions\"\n  }\n}"
    OwnersLinks:
      description: 'links that can be used for further navigation when browsing balances Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the owners of a given account |

        | parent-list | link to the list of all available accounts |

        | balances | link to the balances for a given account |

        | transactions | link to the transactions of a given account |

        | overdrafts | link to the lists of overdrafts of a given account |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        balances:
          $ref: '#/components/schemas/GenericLink'
        transactions:
          $ref: '#/components/schemas/GenericLink'
        overdrafts:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\": {\n    \"href\": \"/v1/accounts/myAccountId/owners\"\n  },\n  \"parentList\": {\n    \"href\": \"/v1/accounts\"\n  },\n  \"balances\": {\n    \"href\": \"/v1/accounts/myAccountId/balances\"\n  },\n  \"transactions\": {\n    \"href\": \"/v1/accounts/myAccountId/transactions\"\n  },\n  \"overdrafts\": {\n    \"href\": \"/v1/accounts/myAccountId/overdrafts\"\n  }\n}    "
    PartyIdentification:
      description: 'API : Description of a Party which can be either a person or an organization.

        '
      type: object
      properties:
        name:
          description: 'ISO20022: Name by which a party is known and which is usually used to identify that party.

            The [organisationId] property allows the specification of an unique and unambiguous way to identify an organisation.

            The [privateId] property allows the specification of an unique and unambiguous way to identify a person.

            '
          type: string
          maxLength: 140
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        organisationId:
          $ref: '#/components/schemas/GenericIdentification'
        privateId:
          $ref: '#/components/schemas/GenericIdentification'
        lei:
          $ref: '#/components/schemas/LeiIdentification'
      required:
      - name
      example: "{\n  \"name\" : \"MyPreferredPisp\",\n  \"postalAddress\" : {\n    \"country\" : \"FR\",\n    \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n  },\n  \"organisationId\" : {\n    \"identification\" : \"12FR5\",\n    \"schemeName\" : \"COID\",\n    \"issuer\" : \"ACPR\"\n  }\n}"
    PercentageRate:
      description: Rate expressed as a percentage, ie, in hundredths, eg, 0.7 is 7/10 of a percent, and 7.0 is 7%.
      type: number
      format: float
    Period:
      description: definition of a time period
      type: object
      properties:
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
      example: "{\n  \"startDate\": \"2021-08-01T00:00+02:00\",\n  \"endDate\": \"2021-08-31T00:00+02:00\"\n}    "
    PhoneNumber:
      description: 'The collection of information which identifies a specific phone or FAX number as defined by telecom services.

        It consists of a "+" followed by the country code (from 1 to 3 characters) then a "-" and finally, any combination of numbers, "(", ")", "+" and "-" (up to 30 characters).

        '
      type: string
      pattern: ^\+[0-9]{1,3}-[0-9()+\-]{1,30}$
    PostalAddress:
      description: 'ISO20022: Information that locates and identifies a specific address, as defined by postal services.

        '
      type: object
      properties:
        addressType:
          description: 'ISO20022: Identifies the nature of the postal address.

            API: Cannot be used for SEPA payments. Proprietary codes can be specified and documented if needed.

            | Code | Name | Description |

            | ---- | ---- | ----------- |

            | BIZZ | Business | Address is the business address |

            | DLVY | Delivery | Address is the address to which delivery is to take place |

            | MLTO | Mail To | Address is the  address to which mail is sent |

            | PBOX | PO Box | Address is is a postal office (PO) box |

            | ADDR | Postal | Address is the complete postal address |

            | HOME | Business | Address is the home address |

            '
          type: string
          enum:
          - BIZZ
          - DLVY
          - MLTO
          - PBOX
          - ADDR
          - HOME
        department:
          description: 'ISO20022: Identification of a division of a large organisation or building.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 70
        subDepartment:
          description: 'ISO20022: Identification of a sub-division of a large organisation or building.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 70
        streetName:
          description: 'ISO20022: Name of a street or thoroughfare.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 70
        buildingNumber:
          description: 'ISO20022: Number that identifies the position of a building on a street.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 16
        buildingName:
          description: 'ISO20022: Name of the building or house.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 16
        postCode:
          description: 'ISO20022: Identifier consisting of a group of letters and/or numbers that is added to a postal address to assist the sorting of mail.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 16
        townName:
          description: 'ISO20022: Name of a built-up area, with defined boundaries, and a local government.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 35
        countrySubDivision:
          description: 'ISO20022: Identifies a subdivision of a country such as state, region, county.

            API: Cannot be used for SEPA payments.

            '
          type: string
          maxLength: 35
        country:
          description: 'ISO20022: Country in which a person resides (the place of a person''s home). In the case of a company, it is the country from which the affairs of that company are directed.

            '
          type: string
          pattern: ^([A-Z]{2,2})$
        addressLine:
          description: 'Unstructured address. The lines must embed zip code and town name.

            For SEPA payments, only two address lines are allowed.

            '
          type: array
          items:
            description: Address line
            type: string
            maxLength: 70
          minItems: 1
          maxItems: 7
      required:
      - country
      example: "{\n  \"country\" : \"FR\",\n  \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n}"
    PsuStatusType:
      description: 'ISO20022: Specifies the type of account ownership.

        | Name | Description |

        | ---- | ---------- |

        | Account Holder | Person which is the sole holder of the account. |

        | Account Co-Holder | Person which shares with others the holding of the account. |

        | Attorney | Generic case of a person having a mandate to access the account data. |

        | Custodian For Minor | Entity that holds shares/units on behalf of a legal minor. Although the account is registered under the name of the minor, the custodian retains control of the account. |

        | Legal Guardian | Entity that was appointed by a legal authority to act on behalf of a person judged to be incapacitated. |

        | Nominee | Entity named by the beneficial owner to act on its behalf, often to facilitate dealing, or to conceal the identity of the beneficiary. |

        | Successor On Death | Deceased''s estate, or successor, to whom the respective percentage of ownership will be transferred upon the death of one of the owners. |

        | Trustee | Legal owners of the property. However, the beneficiary has the equitable or beneficial ownership. |

        '
      type: string
      maxLength: 35
    ReferredDocumentInformation:
      description: Provides the identification and the content of the referred document.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CodeAndIssuer'
        number:
          description: Unique and unambiguous identification of the referred document.
          type: string
          maxLength: 35
        relatedDate:
          description: Date associated with the referred document.
          type: string
          format: date
        lineDetails:
          description: Sets of elements used to provide the content of the referred document line.
          type: array
          items:
            $ref: '#/components/schemas/LineDetail'
          minItems: 1
      example: "{\n  \"type\" : {\n    \"code\" : \"CD01\",\n    \"issuer\" : \"MyIssuer\"\n  },\n  \"number\" : \"1\",\n  \"relatedDate\" : \"2020-02-19\",\n  \"lineDetails\" : [ {\n    \"amount\" : {\n      \"remittedAmount\" : {\n        \"amount\" : 123.45,\n        \"currency\" : \"EUR\"\n      }\n    }\n  } ]\n}"
    ReferredDocumentInformations:
      description: 'Provides the identification and the content of the referred documents.

        '
      type: array
      items:
        $ref: '#/components/schemas/ReferredDocumentInformation'
      minItems: 1
    RelatedParties:
      description: information about the parties that are related to the transaction
      type: object
      properties:
        initiatingParty:
          $ref: '#/components/schemas/PartyIdentification'
        debtorAgent:
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        debtor:
          $ref: '#/components/schemas/PartyIdentification'
        debtorAccount:
          $ref: '#/components/schemas/AccountIdentification'
        ultimateDebtor:
          $ref: '#/components/schemas/PartyIdentification'
        creditorAgent:
          $ref: '#/components/schemas/FinancialInstitutionIdentification'
        creditor:
          $ref: '#/components/schemas/PartyIdentification'
        creditorAccount:
          $ref: '#/components/schemas/AccountIdentification'
        ultimateCreditor:
          $ref: '#/components/schemas/PartyIdentification'
      example: "{\n  \"creditorAgent\" : {\n    \"bicFi\" : \"BNKAFRPPXXX\"\n  },\n  \"creditor\" : {\n    \"name\" : \"MyPreferredPisp\",\n    \"postalAddress\" : {\n      \"country\" : \"FR\",\n      \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n    },\n    \"organisationId\" : {\n      \"identification\" : \"12FR5\",\n      \"schemeName\" : \"COID\",\n      \"issuer\" : \"ACPR\"\n    }\n  },\n  \"creditorAccount\" : {\n    \"iban\" : \"YY64COJH41059545330222956960771321\",\n    \"currency\" : \"EUR\"\n  }\n}"
    RemittanceAmount:
      description: 'ISO20022: Provides details on the amounts of the document line.

        API: Amounts must always be set as positive values.

        | Property | Description |

        | -------- | ----------- |

        | duePayableAmount | Amount specified is the exact amount due and payable to the creditor. |

        | discountAppliedAmount | Amount of discount to be applied to the amount due and payable to the creditor. |

        | creditNoteAmount | Amount of a credit note. |

        | taxAmount | Amount of the tax. |

        | adjustmentAmountAndReason | Specifies detailed information on the amount and reason of the adjustment. |

        | remittedAmount | Amount of money remitted. |

        '
      type: object
      properties:
        duePayableAmount:
          $ref: '#/components/schemas/AmountType'
        discountAppliedAmount:
          $ref: '#/components/schemas/TypedAmount'
        creditNoteAmount:
          $ref: '#/components/schemas/AmountType'
        taxAmount:
          $ref: '#/components/schemas/TypedAmount'
        adjustmentAmountAndReason:
          $ref: '#/components/schemas/DocumentAdjustment'
        remittedAmount:
          $ref: '#/components/schemas/AmountType'
      example: "{\n  \"remittedAmount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  }\n}"
    RemittanceInformation:
      description: 'ISO20022: Information supplied to enable the matching of an entry with the items that the transfer is intended to settle, such as commercial invoices in an accounts'' receivable system.

        API:

        - Only one occurrence of the unstructured information is allowed.

        - Only one occurrence of the structured information is allowed.

        - Structured and unstructured information can coexist.

        '
      type: object
      properties:
        unstructured:
          description: "Unstructured remittance information.\nEach implementation may add a pattern in order to specify its own character set constraints. \n"
          type: array
          items:
            title: remittanceLine
            description: Relevant information to the transaction
            type: string
            maxLength: 140
          minItems: 1
        structured:
          description: Structured remittance information
          type: array
          items:
            $ref: '#/components/schemas/StructuredRemittanceInformation'
          minItems: 1
      example: "{\n  \"unstructured\" : [ \"MyRemittanceInformation\" ]\n}"
    ResourceId:
      description: 'API: Identifier assigned by the ASPSP for further use of the created resource through API calls.

        The API client cannot set or modify the value of this field.

        Since this value can be exchanged between the server and the client as an URL element or for support information, it must not contain sensitive value such as personal or business data.

        However it is the duty of each ASPSP to perform its own risk analysis on this topic.

        '
      type: string
      pattern: ^([a-zA-Z0-9_ /\-?:\()\.,']{1,100})$
      readOnly: true
    StandingOrderCharacteristics:
      description: 'Specifies the characteristics of a standing order.

        '
      type: object
      properties:
        startDate:
          $ref: '#/components/schemas/StartDate'
        endDate:
          $ref: '#/components/schemas/EndDate'
        executionRule:
          $ref: '#/components/schemas/ExecutionRule'
        frequency:
          $ref: '#/components/schemas/FrequencyCode'
      required:
      - startDate
      - executionRule
      - frequency
      example: "{\n  \"startDate\" : \"2020-02-24T00:00Z\",\n  \"executionRule\" : \"FWNG\",\n  \"frequency\" : \"MNTH\"\n}"
    StartDate:
      description: 'The first applicable day of execution for a given period.

        '
      type: string
      format: date-time
    StructuredRemittanceInformation:
      description: 'Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts'' receivable system, in a structured form.

        '
      type: object
      properties:
        referredDocumentInformation:
          $ref: '#/components/schemas/ReferredDocumentInformations'
        referredDocumentAmount:
          $ref: '#/components/schemas/RemittanceAmount'
        creditorReferenceInformation:
          $ref: '#/components/schemas/CreditorReferenceInformation'
        invoicer:
          $ref: '#/components/schemas/PartyIdentification'
        invoicee:
          $ref: '#/components/schemas/PartyIdentification'
        taxRemittance:
          $ref: '#/components/schemas/TaxInformation'
      example: "{\n  \"referredDocumentInformation\" : [ {\n    \"type\" : {\n      \"code\" : \"CD01\",\n      \"issuer\" : \"MyIssuer\"\n    },\n    \"number\" : \"1\",\n    \"relatedDate\" : \"2020-02-19\",\n    \"lineDetails\" : [ {\n      \"amount\" : {\n        \"remittedAmount\" : {\n          \"amount\" : 123.45,\n          \"currency\" : \"EUR\"\n        }\n      }\n    } ]\n  } ],\n  \"referredDocumentAmount\" : {\n    \"remittedAmount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    }\n  },\n  \"creditorReferenceInformation\" : {\n    \"type\" : {\n      \"code\" : \"CD01\",\n      \"issuer\" : \"MyIssuer\"\n    },\n    \"reference\" : \"CredRef56FH6\"\n  },\n  \"invoicee\" : {\n    \"name\" : \"MyPreferredPisp\",\n    \"postalAddress\" : {\n      \"country\" : \"FR\",\n      \"addressLine\" : [ \"18 rue de la DSP2\", \"75008 PARIS\" ]\n    },\n    \"organisationId\" : {\n      \"identification\" : \"12FR5\",\n      \"schemeName\" : \"COID\",\n      \"issuer\"\
        \ : \"ACPR\"\n    }\n  },\n  \"taxRemittance\" : {\n    \"creditor\" : {\n      \"taxIdentification\" : \"TaxIdHGH5445\",\n      \"registrationIdentification\" : \"REGId387H\",\n      \"taxType\" : \"VAT\",\n      \"authorisation\" : {\n        \"title\" : \"M.\",\n        \"name\" : \"John Doe\"\n      }\n    },\n    \"debtor\" : {\n      \"taxIdentification\" : \"TaxIdHGH5445\",\n      \"registrationIdentification\" : \"REGId387H\",\n      \"taxType\" : \"VAT\",\n      \"authorisation\" : {\n        \"title\" : \"M.\",\n        \"name\" : \"John Doe\"\n      }\n    },\n    \"administrationZone\" : \"FR\",\n    \"method\" : \"CT\",\n    \"date\" : \"2020-02-19\",\n    \"record\" : [ {\n      \"type\" : \"NationalTax\",\n      \"category\" : \"VAT\",\n      \"categoryDetails\" : \"VAT02\",\n      \"debtorStatus\" : \"Valid\",\n      \"certificateIdentification\" : \"CertId56RD\",\n      \"formsCode\" : \"FormHJH7\",\n      \"period\" : {\n        \"year\" : \"2020\",\n        \"\
        type\" : \"QTR4\",\n        \"fromDate\" : \"2019-10-01\",\n        \"toDate\" : \"2020-01-01\"\n      },\n      \"taxAmount\" : {\n        \"details\" : [ {\n          \"period\" : {\n            \"year\" : \"2020\",\n            \"type\" : \"QTR4\",\n            \"fromDate\" : \"2019-10-01\",\n            \"toDate\" : \"2020-01-01\"\n          },\n          \"amount\" : {\n            \"amount\" : 123.45,\n            \"currency\" : \"EUR\"\n          }\n        } ]\n      },\n      \"additionalInformation\" : \"Some comment\"\n    } ]\n  }\n}"
    TaxAmount:
      description: 'ISO20022: Set of elements used to provide information on the amount of the tax record.

        API: Amounts must always be set as positive values.

        | Property | Description |

        | -------- | ----------- |

        | rate | Rate used to calculate the tax. |

        | taxableBaseAmount | Amount of money on which the tax is based. |

        | totalAmount | Total amount that is the result of the calculation of the tax for the record. |

        | details | Set of elements used to provide details on the tax period and amount. |

        '
      type: object
      properties:
        rate:
          $ref: '#/components/schemas/PercentageRate'
        taxableBaseAmount:
          $ref: '#/components/schemas/AmountType'
        totalAmount:
          $ref: '#/components/schemas/AmountType'
        details:
          description: Set of elements used to provide details on the tax period and amount.
          type: array
          items:
            $ref: '#/components/schemas/TaxRecordDetails'
          minItems: 1
      example: "{\n  \"details\" : [ {\n    \"period\" : {\n      \"year\" : \"2020\",\n      \"type\" : \"QTR4\",\n      \"fromDate\" : \"2019-10-01\",\n      \"toDate\" : \"2020-01-01\"\n    },\n    \"amount\" : {\n      \"amount\" : 123.45,\n      \"currency\" : \"EUR\"\n    }\n  } ]\n}"
    TaxCharges:
      description: 'ISO20022: Provides details on the tax applied to charges.

        - The [rate] property is the rate used to calculate the tax.

        - the [amount] property is the amount of money resulting from the calculation of the tax.

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        identification:
          description: Unique reference to unambiguously identify the nature of the tax levied, such as Value Added Tax (VAT).
          type: string
          maxLength: 35
        rate:
          $ref: '#/components/schemas/PercentageRate'
        amount:
          $ref: '#/components/schemas/AmountType'
      example: "{\n  \"identification\" : \"VAT\",\n  \"rate\" : 12.3,\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  }\n}"
    TaxInformation:
      description: 'ISO20022: Details about tax paid, or to be paid, to the government in accordance with the law, including pre-defined parameters such as thresholds and type of account.

        API: Amounts must always be set as positive values.

        The [totalTaxableBaseAmount] property indicates the total amount of money on which the tax is based.

        The [totalTaxAmount] property indicates the total amount of money as result of the calculation of the tax.

        '
      type: object
      properties:
        creditor:
          $ref: '#/components/schemas/TaxParty'
        debtor:
          $ref: '#/components/schemas/TaxParty'
        ultimateDebtor:
          $ref: '#/components/schemas/TaxParty'
        administrationZone:
          description: Territorial part of a country to which the tax payment is related.
          type: string
          maxLength: 35
        referenceNumber:
          description: Tax reference information that is specific to a taxing agency.
          type: string
          maxLength: 140
        method:
          description: Method used to indicate the underlying business or how the tax is paid.
          type: string
          maxLength: 35
        totalTaxableBaseAmount:
          $ref: '#/components/schemas/AmountType'
        totalTaxAmount:
          $ref: '#/components/schemas/AmountType'
        date:
          description: Date by which tax is due.
          type: string
          format: date
        sequenceNumber:
          description: Sequential number of the tax report.
          type: integer
          format: int32
        record:
          description: Records of tax details
          type: array
          items:
            $ref: '#/components/schemas/TaxRecord'
          minItems: 1
      example: "{\n  \"creditor\" : {\n    \"taxIdentification\" : \"TaxIdHGH5445\",\n    \"registrationIdentification\" : \"REGId387H\",\n    \"taxType\" : \"VAT\",\n    \"authorisation\" : {\n      \"title\" : \"M.\",\n      \"name\" : \"John Doe\"\n    }\n  },\n  \"debtor\" : {\n    \"taxIdentification\" : \"TaxIdHGH5445\",\n    \"registrationIdentification\" : \"REGId387H\",\n    \"taxType\" : \"VAT\",\n    \"authorisation\" : {\n      \"title\" : \"M.\",\n      \"name\" : \"John Doe\"\n    }\n  },\n  \"administrationZone\" : \"FR\",\n  \"method\" : \"CT\",\n  \"date\" : \"2020-02-19\",\n  \"record\" : [ {\n    \"type\" : \"NationalTax\",\n    \"category\" : \"VAT\",\n    \"categoryDetails\" : \"VAT02\",\n    \"debtorStatus\" : \"Valid\",\n    \"certificateIdentification\" : \"CertId56RD\",\n    \"formsCode\" : \"FormHJH7\",\n    \"period\" : {\n      \"year\" : \"2020\",\n      \"type\" : \"QTR4\",\n      \"fromDate\" : \"2019-10-01\",\n      \"toDate\" : \"2020-01-01\"\n    },\n  \
        \  \"taxAmount\" : {\n      \"details\" : [ {\n        \"period\" : {\n          \"year\" : \"2020\",\n          \"type\" : \"QTR4\",\n          \"fromDate\" : \"2019-10-01\",\n          \"toDate\" : \"2020-01-01\"\n        },\n        \"amount\" : {\n          \"amount\" : 123.45,\n          \"currency\" : \"EUR\"\n        }\n      } ]\n    },\n    \"additionalInformation\" : \"Some comment\"\n  } ]\n}"
    TaxParty:
      description: 'Set of elements used to identify a party of the transaction to which the tax applies.

        The [authorization] property aims to provide the details of the authorised tax paying party.

        '
      type: object
      properties:
        taxIdentification:
          description: Tax identification number of the party.
          type: string
          maxLength: 35
        registrationIdentification:
          description: Unique identification, as assigned by an organisation, to unambiguously identify a party.
          type: string
          maxLength: 35
        taxType:
          description: Type of tax payer.
          type: string
          maxLength: 35
        authorisation:
          $ref: '#/components/schemas/TitleAndName'
      example: "{\n  \"taxIdentification\" : \"TaxIdHGH5445\",\n  \"registrationIdentification\" : \"REGId387H\",\n  \"taxType\" : \"VAT\",\n  \"authorisation\" : {\n    \"title\" : \"M.\",\n    \"name\" : \"John Doe\"\n  }\n}"
    TaxPeriod:
      description: 'Set of elements used to provide details on the period of time related to the tax payment.

        The [type] property aims to identify the period related to the tax payment.

        '
      type: object
      properties:
        year:
          description: Year related to the tax payment.
          type: string
          pattern: ^[0-9]{4,4}$
        type:
          $ref: '#/components/schemas/TaxRecordPeriodCode'
        fromDate:
          description: Start date of the range.
          type: string
          format: date
        toDate:
          description: End date of the range.
          type: string
          format: date
      example: "{\n  \"year\" : \"2020\",\n  \"type\" : \"QTR4\",\n  \"fromDate\" : \"2019-10-01\",\n  \"toDate\" : \"2020-01-01\"\n}"
    TaxRecord:
      description: 'Record of tax details

        the [period] property embbeds the set of elements used to provide details on the period of time related to the tax payment.

        the [amount] property embbeds the set of elements used to provide information on the amount of the tax record.

        '
      type: object
      properties:
        type:
          description: High level code to identify the type of tax details.
          type: string
          maxLength: 35
        category:
          description: Specifies the tax code as published by the tax authority.
          type: string
          maxLength: 35
        categoryDetails:
          description: Provides further details of the category tax code.
          type: string
          maxLength: 35
        debtorStatus:
          description: Code provided by local authority to identify the status of the party that has drawn up the settlement document.
          type: string
          maxLength: 35
        certificateIdentification:
          description: Identification number of the tax report as assigned by the taxing authority.
          type: string
          maxLength: 35
        formsCode:
          description: Identifies, in a coded form, on which template the tax report is to be provided.
          type: string
          maxLength: 35
        period:
          $ref: '#/components/schemas/TaxPeriod'
        taxAmount:
          $ref: '#/components/schemas/TaxAmount'
        additionalInformation:
          description: Further details of the tax record.
          type: string
          maxLength: 140
      example: "{\n  \"type\" : \"NationalTax\",\n  \"category\" : \"VAT\",\n  \"categoryDetails\" : \"VAT02\",\n  \"debtorStatus\" : \"Valid\",\n  \"certificateIdentification\" : \"CertId56RD\",\n  \"formsCode\" : \"FormHJH7\",\n  \"period\" : {\n    \"year\" : \"2020\",\n    \"type\" : \"QTR4\",\n    \"fromDate\" : \"2019-10-01\",\n    \"toDate\" : \"2020-01-01\"\n  },\n  \"taxAmount\" : {\n    \"details\" : [ {\n      \"period\" : {\n        \"year\" : \"2020\",\n        \"type\" : \"QTR4\",\n        \"fromDate\" : \"2019-10-01\",\n        \"toDate\" : \"2020-01-01\"\n      },\n      \"amount\" : {\n        \"amount\" : 123.45,\n        \"currency\" : \"EUR\"\n      }\n    } ]\n  },\n  \"additionalInformation\" : \"Some comment\"\n}"
    TaxRecordDetails:
      description: 'ISO20022: Elements used to provide details on the tax period and amount.

        API: Amounts must always be set as positive values.

        | Property | Description |

        | -------- | ----------- |

        | period | Set of elements used to provide details on the period of time related to the tax payment. |

        | amount | Underlying tax amount related to the specified period. |

        '
      type: object
      properties:
        period:
          $ref: '#/components/schemas/TaxPeriod'
        amount:
          $ref: '#/components/schemas/AmountType'
      required:
      - amount
      example: "{\n  \"period\" : {\n    \"year\" : \"2020\",\n    \"type\" : \"QTR4\",\n    \"fromDate\" : \"2019-10-01\",\n    \"toDate\" : \"2020-01-01\"\n  },\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  }\n}"
    TaxRecordPeriodCode:
      description: 'Identification of the period related to the tax payment.

        | Code | Description |

        | ---- | ---------- |

        | MM01 | FirstMonth Tax is related to the second month of the period. |

        | MM02 | SecondMonth Tax is related to the first month of the period. |

        | MM03 | ThirdMonth Tax is related to the third month of the  period. |

        | MM04 | FourthMonth Tax is related to the fourth month of the period. |

        | MM05 | FifthMonth Tax is related to the fifth month of the period. |

        | MM06 | SixthMonth Tax is related to the sixth month of the period. |

        | MM07 | SeventhMonth Tax is related to the seventh month of the period. |

        | MM08 | EighthMonth Tax is related to the eighth month of the period. |

        | MM09 | NinthMonth Tax is related to the ninth month of the period. |

        | MM10 | TenthMonth Tax is related to the tenth month of the period. |

        | MM11 | EleventhMonth Tax is related to the eleventh month of the period. |

        | MM12 | TwelfthMonth Tax is related to the twelfth month of the period. |

        | QTR1 | FirstQuarter Tax is related to the first quarter of the period. |

        | QTR2 | SecondQuarter Tax is related to the second quarter of the period. |

        | QTR3 | ThirdQuarter Tax is related to the third quarter of the period. |

        | QTR4 | FourthQuarter Tax is related to the fourth quarter of the period. |

        | HLF1 | FirstHalf Tax is related to the first half of the period. |

        | HLF2 | SecondHalf Tax is related to the second half of the period. |

        '
      type: string
      enum:
      - MM01
      - MM02
      - MM03
      - MM04
      - MM05
      - MM06
      - MM07
      - MM08
      - MM09
      - MM10
      - MM11
      - MM12
      - QTR1
      - QTR2
      - QTR3
      - QTR4
      - HLF1
      - HLF2
    TitleAndName:
      description: Title and Name of the party or the party's authorised reprensentative.
      type: object
      properties:
        title:
          description: Title or position of the party or the party's authorised reprensentative.
          type: string
          maxLength: 35
        name:
          description: Name of the party or the party's authorised reprensentative.
          type: string
          maxLength: 140
      example: "{\n  \"title\" : \"M.\",\n  \"name\" : \"John Doe\"\n}"
    TransactionDetailsLinks:
      description: 'links that can be used after retrieving details on a given transaction

        | Link | Description |

        | ---- | ----------- |

        | transactions | link to the transaction list |

        | accounts | link to the list of all available accounts |

        '
      type: object
      properties:
        transactions:
          $ref: '#/components/schemas/GenericLink'
        accounts:
          $ref: '#/components/schemas/GenericLink'
      readOnly: true
      example: "{\n  \"transactions\": {\n    \"href\": \"/v1/accounts/Alias1/transactions\"\n  },\n  \"accounts\": {\n    \"href\": \"/v1/accounts\"\n  }\n}    "
    TransactionLinks:
      description: 'links that can be used for further retrieving details on a given transaction

        | Link | Description |

        | ---- | ----------- |

        | details | link to the details of the transaction |

        '
      type: object
      properties:
        details:
          $ref: '#/components/schemas/GenericLink'
      readOnly: true
      example: "{\n  \"details\": {\n    \"href\": \"/v1/accounts/Alias1/transactions/Transaction1/details\"\n  }\n}"
    TransactionResource:
      description: 'ISO20022: Structure of a transaction.

        - the [charges] property provides information on the charges, pre-advised or included in the entry amount.

        - the [relatedParties] property specifies either the debtor or the creditor counterpart information

        API:

        - Amounts must always be set as positive values in complement with the Credit/Debit indicator.

        - At least expectedBookingDate or bookingDate must be provided"

        '
      type: object
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
        entryReference:
          description: 'Technical incremental identification of the transaction used for reconciliation by the AISP.

            Once assigned, this value cannot be changed for the relevant transaction.

            It is assumed that this value is unique and thus cannot be shared by several transactions.


            The reconciliation of transactions can be done by the [resourceId] or the [entryReference] field.

            If none of these fields cannot be provided, it is therefore suggested that the [remittanceInformation] field, once set, should not be updated afterwards.  

            Actually the [additionalTransactionInformation] field can be used to update the details of a given transaction.   

            '
          type: string
          maxLength: 40
        transactionAmount:
          $ref: '#/components/schemas/AmountType'
        creditDebitIndicator:
          $ref: '#/components/schemas/CreditDebitIndicator'
        transactionAmountDetails:
          $ref: '#/components/schemas/AmountAndCurrencyExchange'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        expectedBookingDate:
          description: 'Expected booking date of the transaction on the account if the transaction is not yet booked.

            '
          type: string
          format: date-time
        bookingDate:
          description: 'Real booking date of the transaction on the account

            '
          type: string
          format: date-time
        valueDate:
          description: Value date of the transaction on the account
          type: string
          format: date-time
        transactionDate:
          description: 'Date used for specific purposes:

            - for card transaction: date of the commercial transaction

            - for credit transfer: acquiring date of the transaction as seen by the Payer''s Bank

            - for direct debit: receiving date of the transaction as seen by the Payer''s Bank

            '
          type: string
          format: date-time
        bankTransactionCode:
          $ref: '#/components/schemas/BankTransactionCode'
        charges:
          $ref: '#/components/schemas/Charges'
        relatedParties:
          $ref: '#/components/schemas/RelatedParties'
        remittanceInformation:
          $ref: '#/components/schemas/RemittanceInformation'
        additionalTransactionInformation:
          description: Additional information about reconciliation.
          type: string
          maxLength: 500
        standingOrderCharacteristics:
          $ref: '#/components/schemas/StandingOrderCharacteristics'
        merchantCategoryCode:
          description: 'Category code conform to ISO 18245, related to the type of services or goods the merchant provides for the transaction.

            '
          type: string
          maxLength: 4
        _links:
          $ref: '#/components/schemas/TransactionLinks'
        bookingPeriod:
          $ref: '#/components/schemas/Period'
        cardId:
          $ref: '#/components/schemas/GenericIdentification'
      required:
      - transactionAmount
      - status
      - creditDebitIndicator
      example: "{\n  \"entryReference\" : \"DHGF36DJ0\",\n  \"transactionAmount\" : {\n    \"amount\" : 12.25,\n    \"currency\" : \"EUR\"\n  },\n  \"creditDebitIndicator\" : \"DBIT\",\n  \"status\" : \"BOOK\",\n  \"bookingDate\" : \"2020-02-14T00:00+01:00\",\n  \"remittanceInformation\" : {\n    \"unstructured\" : [ \"Chèque n°XXXXXXX\" ]\n  }\n}"
    TransactionsLinks:
      description: 'links that can be used for further navigation when browsing transactions Information at one account level

        | Link | Description |

        | ---- | ----------- |

        | self | link to the transactions of a given account |

        | parent-list | link to the list of all available accounts |

        | owners | link to the owners identities for a given account |

        | balances | link to the balances of a given account |

        | overdrafts | link to the lists of overdrafts of a given account |

        | first | link to the first page of the transactions result |

        | last | link to the last page of the transactions result |

        | next | link to the next page of the transactions result |

        | prev | link to the previous page of the transactions result |

        '
      type: object
      properties:
        self:
          $ref: '#/components/schemas/GenericLink'
        parent-list:
          $ref: '#/components/schemas/GenericLink'
        owners:
          $ref: '#/components/schemas/GenericLink'
        balances:
          $ref: '#/components/schemas/GenericLink'
        overdrafts:
          $ref: '#/components/schemas/GenericLink'
        first:
          $ref: '#/components/schemas/GenericLink'
        last:
          $ref: '#/components/schemas/GenericLink'
        next:
          $ref: '#/components/schemas/GenericLink'
        prev:
          $ref: '#/components/schemas/GenericLink'
      required:
      - self
      readOnly: true
      example: "{\n  \"self\" : {\n    \"href\" : \"/v1/accounts/Alias1/transactions\"\n  },\n  \"parent-list\" : {\n    \"href\" : \"/v1/accounts\"\n  },\n  \"balances\" : {\n    \"href\" : \"/v1/accounts/Alias1/balances\"\n  },\n  \"overdrafts\" : {\n    \"href\" : \"/v1/accounts/Alias1/overdrafts\"\n  },\n  \"last\" : {\n    \"href\" : \"/v1/accounts/Alias1/transactions?page=last\"\n  },\n  \"next\" : {\n    \"href\" : \"/v1/accounts/Alias1/transactions?page=next\"\n  }\n}"
    TransactionStatus:
      description: 'Type of Transaction

        | Code | Name | Description |

        | ---- | ---- | ----------- |

        | BOOK | ClosingBooked | Accounted transaction |

        | PDNG | Pending | Transaction that is to be accounted and does already affect the instant balance |

        | FUTR | Future | Entry is on the books of the account servicer and value will be applied to the account owner at a future date and time. |

        | INFO | Information | Entry is only provided for information, and no booking on the account owner''s account in the account servicer''s ledger was performed. |

        '
      type: string
      enum:
      - BOOK
      - PDNG
      - FUTR
      - INFO
    TypedAmount:
      description: 'ISO20022: Typed Amount

        API: Amounts must always be set as positive values.

        '
      type: object
      properties:
        type:
          description: Type of the amount
          type: string
          maxLength: 35
        amount:
          $ref: '#/components/schemas/AmountType'
      required:
      - amount
      example: "{\n  \"type\" : \"CHRG\",\n  \"amount\" : {\n    \"amount\" : 123.45,\n    \"currency\" : \"EUR\"\n  }\n}"
    Workspace:
      description: Some ASPSP may provide different user workspaces that can be accessed by the same authenticated PSU. In this case, the AISP is able to retrieve the different pieces of account information by specifying the relevant workspace as a QUERY parameter. Identification of the workspace to be used when processing the request. If not present, the default workspace to be used is the one that is linked to the authentication processed during the OAuth2 access token request.
      type: object
      properties:
        identification:
          description: identification of the workspace to be used as an optional query parameter for some AISP queries
          type: string
          maxLength: 32
        label:
          description: textual description of the workspace as specified by the ASPSP in relationship wth the PSU
          type: string
          maxLength: 128
      required:
      - identification
      - label
      example: "{\n  \"identification\" : \"PRO_1\",\n  \"label\" : \"comptes de la SARL PRO1\"\n}"
  securitySchemes:
    accessCode:
      description: 'In order to access the PSU''s account information, the AISP needs to get either an authorization code grant or a Client Initiated Backchannel Authentication token.

        In order to post a funds confirmation request, the CBPII needs to get either an authorization code grant or a Client Initiated Backchannel Authentication token when registration of the account has not been previously processed.

        In order to confirm a Payment or Transfer Request, the PISP needs to get either an authorization code grant or a Client Initiated Backchannel Authentication token.

        The client_id field within the token request must be filled with the value of the organization identifier attribute that was set in the distinguished name of eIDAS certificate of the TPP, according to ETSI recommandations.

        (cf §5.2.1 of [ETSI specfication](https://www.etsi.org/standards-search#page=1&search=TS119495))

        '
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /stet/psd2/oauth/authorize
          tokenUrl: /stet/psd2/oauth/token
          scopes:
            aisp: Access by an AISP to one given PSU's account
            extended_transaction_history: Access by an AISP to a transaction history over more than the 90 last days
          refreshUrl: /stet/psd2/oauth/token
