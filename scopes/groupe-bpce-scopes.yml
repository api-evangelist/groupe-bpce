  flows:
  - flow: authorizationCode
    authorizationUrl: /stet/psd2/oauth/authorize
    tokenUrl: /stet/psd2/oauth/token
  description: 'In order to access the PSU''s account information, the AISP needs to get either an authorization
    code grant or a Client Initiated Backchannel Authentication token.

    In order to post a funds confirmation request, the CBPII needs to get either an authorization code grant or
    a Client Initiated Backchannel Authentication token when registration of the account has not been previously
    processed.

    In order to confirm a Payment or Transfer Request, the PISP needs to get either an authorization code grant
    or a Client Initiated Backchannel Authentication token.

    The client_id field within the token request must be filled with the value of the organization identifier attribute
    that was set in the distinguished name of eIDAS certificate of the TPP, according to ETSI recommandations.

    (cf §5.2.1 of [ETSI specfication](https://www.etsi.org/standards-search#page=1&search=TS119495))'
