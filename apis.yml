aid: groupe-bpce

name: Groupe BPCE

description: Groupe BPCE is the second-largest banking group in France, operating retail banking and insurance through its main brands Banque
  Populaire, Caisse d'Epargne and Natixis (per groupebpce.com). Through its Group BPCE API STORE (apistore.groupebpce.com) it publishes an API
  product catalog and developer center covering payment and collection services and PSD2 (DSP2) regulatory APIs for account information, payment
  initiation and funds confirmation for authorized payment service providers, with technical and sales support. It also publishes its API design
  guidelines and Spectral rulesets on GitHub (github.com/BPCE).

